name: bitrisesample
description: "A new Flutter project for iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2 # 🟢 เพิ่มแพ็กเกจจัดการ DateFormat และภาษา
  shared_preferences: ^2.5.3 # 🟢 เพิ่มสำหรับจัดการ Local Storage / Auth Token
  file_picker: ^10.3.8 # 🟢 เพิ่มสำหรับเลือกไฟล์ .ipa ในเครื่อง

  # 🟢 UI / FX & Animations
  lottie: ^3.5.1
  glassmorphism: ^3.0.0
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  auto_size_text: ^3.0.0
  animated_text_kit: ^4.3.0

  # 🟢 Navigation & Layouts
  curved_navigation_bar: ^1.0.6
  persistent_bottom_nav_bar_v2: ^6.4.0
  flutter_staggered_grid_view: ^0.7.0

  # 🟢 Dialogs, Toasts & Components
  awesome_dialog: ^3.3.0
  cherry_toast: ^1.13.0
  delightful_toast: ^1.1.0
  toastification: ^0.0.2
  panara_dialogs: ^0.1.5
  flutter_slidable: ^4.0.3
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

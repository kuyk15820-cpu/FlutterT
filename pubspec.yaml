name: bitrisesample
description: "A new Flutter project for iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  font_awesome_flutter: ^11.0.0

  # 🟢 UI / FX & Animations
  lottie: ^3.1.2
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  auto_size_text: ^3.0.0
  animated_text_kit: ^4.2.2

  # 🟢 Navigation & Layouts
  curved_navigation_bar: ^1.0.6
  persistent_bottom_nav_bar_v2: ^5.2.2
  flutter_staggered_grid_view: ^0.7.0

  # 🟢 Dialogs, Toasts & Components
  awesome_dialog: ^3.2.1
  cherry_toast: ^1.12.0
  delightful_toast: ^1.1.0
  flutter_slidable: ^3.1.0
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

name: Build Flutter iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'FX-Dash'
      bundle_id:
        description: 'Bundle Identifier'
        required: false
        default: 'com.apple.adm'
      app_version:
        description: 'App Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      build_number:
        description: 'Build Number (e.g. 1)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. ติดตั้ง Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      # 2. ดึง Dependencies ของ Flutter
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 🟢 เตรียมไฟล์ Native Configs โดยใส่ --no-codesign เพื่อข้ามการเช็ก Certificate ในขั้นตอนนี้
      - name: Prepare iOS Native Configs
        run: |
          flutter build ios --config-only --no-codesign
          cd ios && pod install

      # แสดง Log เปรียบเทียบเวอร์ชัน Package ปัจจุบัน vs ล่าสุด
      - name: Check Dependencies Outdated
        run: flutter pub outdated

      # 3. ปรับแต่ง App Name, Bundle ID และ Version ใน Xcode Project ของ Flutter (Runner.xcodeproj)
      - name: Update iOS Metadata
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'FX-Dash' }}
          BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.apple.adm' }}
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '1' }}
        run: |
          gem install xcodeproj
          ruby << 'EOF'
          require 'xcodeproj'

          project_path = Dir.glob('ios/*.xcodeproj').first
          unless project_path
            puts 'No .xcodeproj found in ios/'
            exit 1
          end

          project = Xcodeproj::Project.open(project_path)
          
          app_name = ENV['APP_NAME']
          bundle_id = ENV['BUNDLE_ID']
          app_version = ENV['APP_VERSION']
          build_number = ENV['BUILD_NUMBER']

          puts "Updating App Configuration:"
          puts "  - App Name: #{app_name}"
          puts "  - Bundle ID: #{bundle_id}"

          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['PRODUCT_NAME'] = app_name
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
              config.build_settings['MARKETING_VERSION'] = app_version
              config.build_settings['CURRENT_PROJECT_VERSION'] = build_number
              config.build_settings['INFOPLIST_KEY_CFBundleDisplayName'] = app_name
            end
          end

          project.save
          puts "Successfully updated project build settings!"
          EOF

      # 4. สั่งรัน build_ipa.sh จาก Root ของโปรเจกต์
      - name: Run Build Script
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      # 5. ย้ายไฟล์ Runner.ipa หรือ .ipa ออกมาไว้ที่ Root build/ เพื่อดึง Artifact
      - name: Prepare Artifact Directory
        run: |
          mkdir -p build_output
          cp ios/build/*.ipa build_output/

      - name: Upload Artifact (PR Only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build_output/*.ipa

      - name: Upload Release IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build_output/*.ipa

  # Job Auto Release บน GitHub
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build_output/

      - name: Get Last 12h Commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="No commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Write Release Notes
        run: |
          cat <<EOF > release_notes.txt
          Nightly Build (Flutter iOS Native)
          
          Commits:
          ${COMMITS}
          EOF

      - name: Update Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly Release" \
            --notes "Initial Nightly Build" \
            --prerelease
      
          gh release edit nightly \
            --title "Nightly Release" \
            --notes-file release_notes.txt \
            --prerelease      
          
          for asset in $(gh release view nightly --json assets -q '.assets[].name'); do
            echo "Deleting old asset: $asset"
            gh release delete-asset nightly "$asset" -y || true
          done

          gh release upload nightly build_output/*.ipa --clobber
